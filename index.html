<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自己歴代">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a26" media="(prefers-color-scheme: dark)">
<title>自己歴代</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #1b2433;
    --muted: #66708a;
    --line: #d6dce8;
    --accent: #3a56d4;
    --another: #d6403f;
    --legg: #9a48d0;
    --warn-bg: #fff1ee;
    --warn-ink: #9c2a1c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a26;
      --surface: #1e2636;
      --ink: #e8ecf5;
      --muted: #97a1ba;
      --line: #2e374b;
      --accent: #8fa4ff;
      --another: #ff7a78;
      --legg: #c58cf2;
      --warn-bg: #3a1f1c;
      --warn-ink: #ffb4a8;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 12px 0 10px;
  }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; min-width: 0;
    font-size: 17px; /* 16px以上でiOSの自動ズームを防ぐ */
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .icon-btn {
    flex: none;
    width: 48px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
  }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { margin: 8px 2px 0; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .song {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px 6px;
    margin-top: 12px;
  }
  .song h2 { margin: 0 0 6px; font-size: 17px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 2px 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: 0; }
  .diff { font-size: 14px; font-weight: 650; }
  .diff small { font-weight: 500; color: var(--muted); margin-left: 4px; }
  .diff.A { color: var(--another); }
  .diff.L { color: var(--legg); }
  .ex { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; text-align: right; line-height: 1.1; }
  .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .sub b { color: var(--ink); font-weight: 600; }

  .notice { margin-top: 24px; color: var(--muted); font-size: 15px; }
  .error {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px;
    background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; overflow-wrap: anywhere;
  }

  /* 設定 */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-top: 20px; }
  .panel h1 { margin: 0 0 4px; font-size: 20px; }
  .panel p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  .field { width: 100%; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .inline { display: flex; gap: 8px; }
  .inline .field { flex: 1; min-width: 0; }
  .btn { font-size: 15px; font-weight: 600; padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #0e1424; } }
  .btn.danger { color: var(--warn-ink); }
  .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .diag {
    margin: 8px 0 0; padding: 10px 12px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    font: 12px/1.55 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
  }
  .error details summary { cursor: pointer; margin-top: 8px; font-weight: 600; }
  .prog { height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .prog > div { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .tools { padding: 2px 0 6px; border-top: 1px solid var(--line); }
  .alias-btn { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 8px 0 4px; cursor: pointer; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .song { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 検索画面 -->
  <section id="viewSearch" hidden>
    <div class="bar">
      <div class="search">
        <input id="q" type="search" inputmode="search" enterkeyhint="search"
               placeholder="曲名(ひらがなでもOK)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="曲名で検索">
        <button id="btnRefresh" class="icon-btn" type="button" aria-label="データを更新" title="データを更新">↻</button>
        <button id="btnSettings" class="icon-btn" type="button" aria-label="設定" title="設定">⚙</button>
      </div>
      <div class="meta"><span id="metaCount"></span><span id="metaTime"></span></div>
      <div id="prog" class="prog" hidden role="progressbar" aria-label="読みの準備"><div id="progBar"></div></div>
    </div>
    <div id="error" class="error" hidden>
      <div id="errorMsg"></div>
      <details id="errorDetail" hidden><summary>詳細(原因の手がかり)</summary><pre id="errorPre" class="diag"></pre></details>
    </div>
    <div id="results"></div>
  </section>

  <!-- 設定画面 -->
  <section id="viewSettings" hidden>
    <div class="panel">
      <h1>設定</h1>
      <p>入力した内容はこのiPhone(ブラウザ)の中だけに保存されます。</p>

      <label for="apiBase">APIのURL(中継を使う場合)</label>
      <input id="apiBase" class="field" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://xxxx.workers.dev/api/v1">
      <div class="hint">空欄なら公式APIへ直接アクセスします。通信失敗になる場合は、中継(Cloudflare Workers)のURLの末尾に /api/v1 を付けて入れてください。</div>

      <label for="token">APIトークン</label>
      <input id="token" class="field" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Bearerトークンを貼り付け">

      <label for="uid">ユーザーID</label>
      <div class="inline">
        <input id="uid" class="field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="自動取得 or 手入力">
        <button id="btnAutoUid" class="btn" type="button">自動取得</button>
      </div>
      <div id="uidMsg" class="hint"></div>
      <pre id="uidDiag" class="diag" hidden></pre>

      <div class="actions">
        <button id="btnSave" class="btn primary" type="button">保存して取得</button>
        <button id="btnBack" class="btn" type="button">戻る</button>
        <button id="btnClear" class="btn danger" type="button">保存データを削除</button>
      </div>
      <div id="settingsMsg" class="error" hidden></div>
    </div>
  </section>

</div>

<script>
(() => {
  'use strict';

  // ===== 設定値(必要ならここだけ変更) =====
  const DEFAULT_API_BASE = 'https://bpi2.poyashi.me/api/v1'; // 直接アクセス(CORSで弾かれる場合は設定で中継URLに切替)
  // ユーザー情報取得APIのパス候補(ドキュメントで確認したものに合わせて先頭を直してください)
  const ME_PATH_CANDIDATES = ['/auth/me', '/auth/user', '/auth/whoami', '/auth/profile', '/users/me', '/me'];
  // 表示する難易度(APIのdifficulty文字列を正規化して前方一致)
  const SHOW_DIFFICULTIES = [
    { key: 'A', match: ['ANOTHER'], label: 'ANOTHER' },
    { key: 'L', match: ['LEGGENDARIA', 'LEGENDARIA'], label: 'LEGGENDARIA' },
  ];
  const MAX_RESULTS = 40;

  const LS_TOKEN = 'bpim2.token';
  const LS_UID = 'bpim2.uid';
  const LS_DATA = 'bpim2.data.v1';
  const LS_BASE = 'bpim2.base';
  // APIの必須パラメータ currentVersion に渡すIIDXのバージョン番号。400で弾かれたら次の候補を順に試す
  const VERSION_CANDIDATES = ['34', '33', '32']; // 先頭が現行(34)

  const $ = (id) => document.getElementById(id);
  const el = {
    viewSearch: $('viewSearch'), viewSettings: $('viewSettings'),
    q: $('q'), results: $('results'), error: $('error'),
    metaCount: $('metaCount'), metaTime: $('metaTime'),
    token: $('token'), uid: $('uid'), uidMsg: $('uidMsg'), uidDiag: $('uidDiag'), settingsMsg: $('settingsMsg'),
    prog: $('prog'), progBar: $('progBar'), apiBase: $('apiBase'), errorMsg: $('errorMsg'), errorDetail: $('errorDetail'), errorPre: $('errorPre'),
    btnRefresh: $('btnRefresh'), btnSettings: $('btnSettings'),
    btnSave: $('btnSave'), btnBack: $('btnBack'), btnClear: $('btnClear'), btnAutoUid: $('btnAutoUid'),
  };

  // ===== localStorage(失敗しても動くように) =====
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // 貼り付け時の混入対策: 前後の空白・改行、先頭の「Bearer 」を除く
  function cleanToken(t) { return String(t || '').replace(/\s+/g, ' ').trim().replace(/^bearer\s+/i, '').replace(/\s+/g, ''); }
  let API_BASE = store.get(LS_BASE) || DEFAULT_API_BASE;
  function applyBase(v) { API_BASE = v || DEFAULT_API_BASE; }

  // ===== 正規化(大文字小文字・全角半角・ひらがなカタカナ) =====
  function normalize(s) {
    return String(s ?? '')
      .normalize('NFKC')                 // 全角英数→半角、半角カナ→全角カナ など
      .toLowerCase()
      .replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)) // カタカナ→ひらがな
      .replace(/\s+/g, ' ')
      .trim();
  }

  function diffInfo(raw) {
    const d = normalize(raw).toUpperCase();
    for (const t of SHOW_DIFFICULTIES) {
      if (t.match.some((m) => d.startsWith(m))) return t;
    }
    return null;
  }

  // ===== データ =====
  let songs = []; // [{title, norm, rows:[{key,label,level,ex,bpi,version}]}]
  let fetchedAt = null;

  function buildSongs(raw) {
    const map = new Map();
    for (const r of raw) {
      const info = diffInfo(r.difficulty);
      if (!info || !r.title) continue;
      let s = map.get(r.title);
      if (!s) { s = { title: r.title, norm: normalize(r.title), rows: [] }; map.set(r.title, s); }
      s.rows.push({
        key: info.key, label: info.label,
        level: r.difficultyLevel ?? null,
        ex: r.bestExScore ?? null,
        bpi: r.bestBpi ?? null,
        version: r.bestVersion ?? '',
      });
    }
    const list = [...map.values()];
    for (const s of list) s.rows.sort((a, b) => (a.key === b.key ? 0 : a.key === 'A' ? -1 : 1));
    list.sort((a, b) => a.norm.localeCompare(b.norm, 'ja'));
    return list;
  }

  function saveCache(raw) {
    // 保存容量を抑えるため必要な項目だけ残す
    const slim = raw.map((r) => ({
      title: r.title, difficulty: r.difficulty, difficultyLevel: r.difficultyLevel,
      bestExScore: r.bestExScore, bestBpi: r.bestBpi, bestVersion: r.bestVersion,
    }));
    store.set(LS_DATA, JSON.stringify({ at: Date.now(), data: slim }));
  }

  function loadCache() {
    const t = store.get(LS_DATA);
    if (!t) return false;
    try {
      const o = JSON.parse(t);
      songs = buildSongs(o.data || []);
      attachReadings();
      fetchedAt = o.at || null;
      return songs.length > 0;
    } catch { return false; }
  }

  class AppError extends Error {
    constructor(kind, msg, detail) { super(msg); this.kind = kind; this.detail = detail || ''; }
  }

  function clip(v, n = 160) {
    const t = String(v ?? '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  // 1回のGET。例外は投げず、結果を常に同じ形で返す(トークンは記録しない)
  async function probe(url, token) {
    const r = { url, path: '', ok: false, status: 0, ct: '', text: '', json: undefined, jsonError: '', netError: '' };
    try { const u = new URL(url); r.path = u.pathname + u.search; } catch { r.path = url; }
    let res;
    try {
      res = await fetch(url, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } });
    } catch (e) {
      r.netError = (e && e.message) || String(e);
      return r;
    }
    r.status = res.status;
    r.ok = res.ok;
    r.ct = res.headers.get('content-type') || '';
    try { r.text = await res.text(); } catch (e) { r.jsonError = '本文を読めません: ' + e.message; return r; }
    try { r.json = JSON.parse(r.text); } catch (e) { r.jsonError = e.message; }
    return r;
  }

  function describe(r) {
    if (r.netError) return `通信失敗 (${r.netError})`;
    const kind = r.jsonError ? `JSONではない: ${clip(r.text, 80)}` : 'JSON';
    const body = (!r.ok && !r.jsonError) ? ` / 応答: ${clip(r.text, 160)}` : '';
    return `HTTP ${r.status} / ${r.ct || 'content-typeなし'} / ${kind}${body}`;
  }

  async function fetchBestEver() {
    const token = store.get(LS_TOKEN);
    const uid = store.get(LS_UID);
    if (!token || !uid) {
      throw new AppError('setup', 'トークンとユーザーIDが未設定です。', '設定画面で両方を入力して「保存して取得」を押してください。');
    }

    const baseUrl = `${API_BASE}/users/${encodeURIComponent(uid)}/scores/best-ever`;
    const versions = VERSION_CANDIDATES;
    const tried = [];
    let r;
    for (const v of versions) {
      r = await probe(`${baseUrl}?currentVersion=${encodeURIComponent(v)}`, token);
      tried.push(`${v}→${r.netError ? '通信失敗' : r.status}`);
      if (!(r.status === 400 && /currentVersion/i.test(r.text))) break;
    }
    const head = `GET ${r.path}` + (tried.length > 1 ? `\ncurrentVersionの試行: ${tried.join(', ')}` : '');

    // 通信そのものが失敗
    if (r.netError) {
      throw new AppError('network', '通信できませんでした(オフライン / CORS / URL誤りのいずれか)。',
        `${head}\nfetch失敗: ${r.netError}\n※ブラウザはこの3つを区別できません。機内モードやWi-Fi不調でなければ、API側がブラウザからのアクセスを許可していない(CORS)可能性が高いです。その場合は設定の「APIのURL」に中継(Cloudflare Workers)のURLを入れてください。`);
    }

    // HTTPエラー
    if (!r.ok) {
      const why = {
        400: 'リクエストが不正です(400)。詳細の応答メッセージを確認してください。',
        401: 'トークンが無効か期限切れです(401)。',
        403: 'このトークンでは権限がありません(403)。',
        404: 'URLまたはユーザーIDが違います(404)。',
        405: 'メソッドが許可されていません(405)。URLが違う可能性があります。',
        429: 'リクエストが多すぎます(429)。少し待ってください。',
      }[r.status] || (r.status >= 500 ? `APIサーバー側のエラーです(${r.status})。` : `APIエラーです(${r.status})。`);
      throw new AppError(r.status === 401 || r.status === 403 ? 'auth' : 'http', why,
        `${head}\n${describe(r)}\n応答の先頭: ${clip(r.text) || '(空)'}`);
    }

    // 形式チェック1: JSONか
    if (r.jsonError) {
      throw new AppError('format', '応答がJSONではありません。',
        `${head}\n${describe(r)}\nJSON解析エラー: ${r.jsonError}\n※URL(/api/v1 の付け忘れなど)が違い、HTMLページが返っている可能性があります。`);
    }

    // 形式チェック2: 配列か(オブジェクトの中に配列があれば救済)
    let raw = r.json;
    let note = '';
    if (!Array.isArray(raw)) {
      const keys = raw && typeof raw === 'object' ? Object.keys(raw) : [];
      const arrKey = keys.find((k) => Array.isArray(raw[k]));
      if (!arrKey) {
        throw new AppError('format', '応答の形式が想定と違います(配列ではありません)。',
          `${head}\n${describe(r)}\n型: ${raw === null ? 'null' : typeof raw}\nキー: ${keys.join(', ') || '(なし)'}\n応答の先頭: ${clip(r.text)}`);
      }
      raw = raw[arrKey];
      note = `※応答は配列ではなく、キー「${arrKey}」の中の配列を使用しました。`;
    }

    // 形式チェック3: 0件
    if (raw.length === 0) {
      throw new AppError('empty', '取得できましたが、スコアが0件でした。',
        `${head}\n${describe(r)}\nまだスコアを取り込んでいないか、ユーザーIDが別のアカウントのものかもしれません。${note}`);
    }

    // 形式チェック4: 必要な項目があるか
    const sample = raw[0] && typeof raw[0] === 'object' ? raw[0] : {};
    const missing = ['title', 'difficulty', 'bestExScore'].filter((k) => !(k in sample));
    if (missing.length) {
      throw new AppError('format', `想定した項目がありません: ${missing.join(', ')}`,
        `${head}\n${describe(r)}\n件数: ${raw.length}\n1件目のキー: ${Object.keys(sample).join(', ') || '(なし)'}\n1件目: ${clip(JSON.stringify(raw[0]), 240)}`);
    }

    // 形式チェック5: 表示対象の難易度があるか
    const list = buildSongs(raw);
    if (!list.length) {
      const vals = [...new Set(raw.map((x) => String(x.difficulty)))].slice(0, 12);
      throw new AppError('filter', `${raw.length}件取得しましたが、ANOTHER / LEGGENDARIA の譜面が見つかりません。`,
        `${head}\ndifficultyの値の例: ${vals.join(', ')}\n※この表記に合わせて SHOW_DIFFICULTIES(ソース上部)を直す必要があります。${note}`);
    }

    saveCache(raw);
    songs = list;
    attachReadings();
    fetchedAt = Date.now();
  }


  // <READING-CORE>
  const KANJI = /[\u4e00-\u9fff々〆ヶ]/;
  const DEVOICE_FROM = 'がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゔ';
  const DEVOICE_TO = 'かきくけこさしすせそたちつてとはひふへほはひふへほう';
  const DEVOICE = {};
  [...DEVOICE_FROM].forEach((c, i) => { DEVOICE[c] = DEVOICE_TO[i]; });

  // カタカナ→ひらがな(全角半角・大文字小文字も統一)
  function toHira(s) {
    return String(s ?? '').normalize('NFKC').toLowerCase()
      .replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }

  // 濁点・半濁点・長音・促音の違いを吸収した比較用キー
  function loose(s) {
    return [...toHira(s)].map((c) => DEVOICE[c] || c).join('')
      .replace(/[ーっ]/g, '')
      .replace(/[^ぁ-ゖa-z0-9\u4e00-\u9fff]/g, '');
  }

  // 辞書にない英単語用の、綴りに沿った簡易カナ変換(asian → あしあん)
  const ROWS = {
    k: [...'かきくけこ'], s: [...'さしすせそ'], t: [...'たちつてと'], n: [...'なにぬねの'],
    h: [...'はひふへほ'], m: [...'まみむめも'], r: [...'らりるれろ'], g: [...'がぎぐげご'],
    z: [...'ざじずぜぞ'], d: [...'だぢづでど'], b: [...'ばびぶべぼ'], p: [...'ぱぴぷぺぽ'],
    v: [...'ばびぶべぼ'], y: [...'やいゆえよ'],
    f: 'ふぁ,ふぃ,ふ,ふぇ,ふぉ'.split(','), w: 'わ,うぃ,う,うぇ,うぉ'.split(','),
    j: 'じゃ,じ,じゅ,じぇ,じょ'.split(','), sh: 'しゃ,し,しゅ,しぇ,しょ'.split(','),
    ch: 'ちゃ,ち,ちゅ,ちぇ,ちょ'.split(','),
  };
  const SOLO = {
    k: 'く', s: 'す', t: 'と', n: 'ん', h: 'ふ', m: 'む', r: 'る', g: 'ぐ', z: 'ず', d: 'ど',
    b: 'ぶ', p: 'ぷ', v: 'ぶ', y: 'い', f: 'ふ', w: 'う', j: 'じ', sh: 'し', ch: 'ち',
  };
  function naiveKana(word) {
    const w = String(word).toLowerCase().replace(/[^a-z]/g, '');
    const VI = { a: 0, i: 1, u: 2, e: 3, o: 4 };
    const VOW = 'あいうえお';
    let out = '';
    let i = 0;
    while (i < w.length) {
      const c = w[i];
      if (c in VI) { out += VOW[VI[c]]; i++; continue; }
      let key = c;
      let len = 1;
      const two = w.slice(i, i + 2);
      if (two === 'sh' || two === 'ch') { key = two; len = 2; }
      else if (two === 'th') { key = 's'; len = 2; }
      else if (two === 'ph') { key = 'f'; len = 2; }
      else if (two === 'wh') { key = 'w'; len = 2; }
      else if (two === 'ck') { key = 'k'; len = 2; }
      else if (c === 'c') { key = 'iey'.includes(w[i + 1] || '-') ? 's' : 'k'; }
      else if (c === 'l') { key = 'r'; }
      else if (c === 'q' || c === 'x') { key = 'k'; }
      if (len === 1 && c !== 'n' && w[i + 1] === c) { out += 'っ'; i++; continue; }
      const next = w[i + len];
      if (next in VI && ROWS[key]) { out += ROWS[key][VI[next]]; i += len + 1; }
      else { out += SOLO[key] || ''; i += len; }
    }
    return out;
  }

  // 漢字を含む部分は形態素解析の読みを使う(tk が無ければそのまま)
  function jaToHira(seg, tk) {
    if (tk && KANJI.test(seg)) {
      return tk.tokenize(seg)
        .map((t) => toHira(t.reading && t.reading !== '*' ? t.reading : t.surface_form))
        .join('');
    }
    return toHira(seg);
  }

  // 曲名 → ひらがなの読み候補(辞書の読み / 綴りどおりの読み)
  function readingsFor(title, tk, eng) {
    const parts = String(title).normalize('NFKC').split(/([A-Za-z]+)/);
    let a = '';
    let b = '';
    for (const p of parts) {
      if (!p) continue;
      if (/^[A-Za-z]+$/.test(p)) {
        const nk = naiveKana(p);
        const dk = eng ? eng[p.toLowerCase()] : null;
        a += dk ? toHira(dk) : nk;
        b += nk;
      } else {
        const j = jaToHira(p, tk);
        a += j;
        b += j;
      }
    }
    return a === b ? [a] : [a, b];
  }

  // 0: 不一致 / 1: 曲名で一致 / 2: 読みで一致(曲名だけでは一致しない語がある)
  function songMatches(song, tokens) {
    let via = 1;
    for (const t of tokens) {
      if (song.norm.includes(t)) continue;
      if (/^[ぁ-ゖー]+$/.test(t)) {
        const lt = loose(t);
        if (lt.length >= 2 && (song.keys || []).some((k) => k.includes(lt))) { via = 2; continue; }
      }
      return 0;
    }
    return via;
  }
  // </READING-CORE>

  // ===== 読み(ひらがな検索)の準備 =====
  const KUROMOJI_JS = 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js';
  const KUROMOJI_DICT = 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/';
  const ENG_DICT_URL = 'eng-kana.json'; // index.html と同じ場所に置く
  const LS_READ = 'bpim2.readings.v1';
  const LS_ALIAS = 'bpim2.aliases.v1';
  // 自動の読みが外れる曲の補正(画面の「読みを追加」からも登録できます)
  const BUILTIN_ALIASES = { '卑弥呼': ['ひみこ'] };

  function loadJson(k) { try { return JSON.parse(store.get(k) || '{}') || {}; } catch { return {}; } }
  let aliasMap = loadJson(LS_ALIAS);
  let readState = '';
  let readingBusy = false;
  let readFrac = null; // 0〜1 のとき進捗バーを表示
  let engPromise = null;

  function getEngDict() {
    if (!engPromise) {
      engPromise = fetch(ENG_DICT_URL).then((r) => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).catch((e) => { engPromise = null; throw e; });
    }
    return engPromise;
  }

  // 漢字を含む部分の一覧(形態素解析にかける文字列)
  function kanjiSegments(titles) {
    const set = new Set();
    for (const t of titles) {
      for (const part of String(t).normalize('NFKC').split(/([A-Za-z]+)/)) {
        if (part && !/^[A-Za-z]+$/.test(part) && KANJI.test(part)) set.add(part);
      }
    }
    return [...set];
  }

  // ===== 漢字辞書(kuromoji)の取得: 進捗表示つき =====
  // ファイル名とバイト数(進捗の分母)。バージョン固定なので変わりません
  const DICT_FILES = {
    'base.dat.gz': 3956825, 'cc.dat.gz': 1692067, 'check.dat.gz': 3111633, 'tid.dat.gz': 1605820,
    'tid_map.dat.gz': 1485576, 'tid_pos.dat.gz': 5916009, 'unk.dat.gz': 10512, 'unk_char.dat.gz': 306,
    'unk_compat.dat.gz': 338, 'unk_invoke.dat.gz': 1140, 'unk_map.dat.gz': 1190, 'unk_pos.dat.gz': 10540,
  };
  const DICT_TOTAL = Object.values(DICT_FILES).reduce((a, b) => a + b, 0);

  function setRead(label, frac) {
    readState = label + (frac !== null && frac !== undefined ? ` ${Math.floor(frac * 100)}%` : '');
    readFrac = frac === undefined ? null : frac;
    renderMeta();
  }

  async function downloadFile(name, onBytes) {
    const res = await fetch(KUROMOJI_DICT + name);
    if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
    if (!res.body || !res.body.getReader) {
      const b = await res.arrayBuffer();
      onBytes(b.byteLength);
      return b;
    }
    const rd = res.body.getReader();
    const chunks = [];
    let n = 0;
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      chunks.push(value);
      n += value.length;
      onBytes(value.length);
    }
    const out = new Uint8Array(n);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out.buffer;
  }

  async function downloadDict() {
    let got = 0;
    const files = {};
    const report = (d) => { got += d; setRead('漢字の辞書をダウンロード中', Math.min(got / DICT_TOTAL, 0.99)); };
    setRead('漢字の辞書をダウンロード中', 0);
    await Promise.all(Object.keys(DICT_FILES).map(async (nm) => { files[nm] = await downloadFile(nm, report); }));
    return files;
  }

  // kuromoji が XMLHttpRequest で辞書を取りに行く部分を、ダウンロード済みデータで置き換える
  function makeFakeXhr(files) {
    return class FakeXhr {
      open(_m, url) { this._name = String(url).split('/').pop(); }
      send() {
        setTimeout(() => {
          const buf = files[this._name];
          if (!buf) { this.status = 404; this.statusText = '辞書ファイルがありません: ' + this._name; } else { this.status = 200; this.response = buf; }
          this.onload();
        }, 0);
      }
    };
  }

  // Worker 内で動かすコード(kuromoji 本体の後ろに連結する)
  const WORKER_LOGIC = `
var FILES = null, tk = null;
function FakeXhr() {}
FakeXhr.prototype.open = function (m, url) { this._name = String(url).split('/').pop(); };
FakeXhr.prototype.send = function () {
  var x = this;
  setTimeout(function () {
    var buf = FILES[x._name];
    if (!buf) { x.status = 404; x.statusText = 'missing ' + x._name; } else { x.status = 200; x.response = buf; }
    x.onload();
  }, 0);
};
onmessage = function (e) {
  var m = e.data;
  if (m.type === 'init') {
    FILES = m.files;
    self.XMLHttpRequest = FakeXhr;
    postMessage({ type: 'building' });
    kuromoji.builder({ dicPath: '/dict/' }).build(function (err, t) {
      if (err) { postMessage({ type: 'error', message: String((err && err.message) || err) }); return; }
      tk = t;
      postMessage({ type: 'ready' });
    });
  } else if (m.type === 'tokenize' && tk) {
    var out = {};
    m.segs.forEach(function (s) {
      out[s] = tk.tokenize(s).map(function (t) {
        return [t.reading && t.reading !== '*' ? t.reading : '', t.surface_form];
      });
    });
    postMessage({ type: 'result', out: out });
  }
};`;

  // 辞書の組み立てと解析を Web Worker で行い、画面操作を止めない
  function tokenizeViaWorker(src, files, segs) {
    return new Promise((resolve, reject) => {
      let url = '';
      let worker = null;
      const finish = (fn, v) => {
        try { if (worker) worker.terminate(); } catch {}
        try { if (url) URL.revokeObjectURL(url); } catch {}
        fn(v);
      };
      try {
        url = URL.createObjectURL(new Blob([src, '\n;\n', WORKER_LOGIC], { type: 'text/javascript' }));
        worker = new Worker(url);
      } catch (e) { reject(e); return; }
      worker.onmessage = (ev) => {
        const m = ev.data || {};
        if (m.type === 'building') setRead('辞書を組み立て中…');
        else if (m.type === 'ready') { setRead('読みを作成中…'); worker.postMessage({ type: 'tokenize', segs }); }
        else if (m.type === 'result') finish(resolve, m.out);
        else if (m.type === 'error') finish(reject, new Error(m.message));
      };
      worker.onerror = (ev) => finish(reject, new Error((ev && ev.message) || 'worker error'));
      worker.postMessage({ type: 'init', files });
    });
  }

  // Worker が使えない場合の最終手段(組み立ての数秒だけ画面が止まる)
  function tokenizerOnMain(src, files) {
    return new Promise((resolve, reject) => {
      try {
        if (!window.kuromoji) {
          const sc = document.createElement('script');
          sc.text = src;
          document.head.append(sc);
        }
        const RealXhr = window.XMLHttpRequest;
        window.XMLHttpRequest = makeFakeXhr(files);
        window.kuromoji.builder({ dicPath: '/dict/' }).build((e, t) => {
          window.XMLHttpRequest = RealXhr;
          if (e) reject(e); else resolve(t);
        });
      } catch (e) { reject(e); }
    });
  }

  // 保存済みの読みと、補正(別名)を曲に結び付ける
  function attachReadings() {
    const rm = loadJson(LS_READ);
    for (const sg of songs) {
      const al = [...(BUILTIN_ALIASES[sg.title] || []), ...(aliasMap[sg.title] || [])];
      sg.keys = [...(rm[sg.title] || []), ...al].map(loose).filter(Boolean);
    }
  }

  // 未計算の曲だけ読みを作って端末に保存(初回のみ少し時間がかかる)
  async function ensureReadings() {
    if (readingBusy || !songs.length) return;
    const rm = loadJson(LS_READ);
    const missing = songs.filter((sg) => !rm[sg.title]);
    if (!missing.length) return;
    readingBusy = true;
    setRead('読みを準備中…');
    try {
      const needJa = missing.some((sg) => KANJI.test(sg.title));
      const needEn = missing.some((sg) => /[A-Za-z]/.test(sg.title));
      let tk = null;
      let eng = null;
      const notes = [];
      let workerNote = '';
      if (needEn) { setRead('英単語辞書を読み込み中…'); try { eng = await getEngDict(); } catch { notes.push('英単語辞書'); } }
      if (needJa) {
        const segs = kanjiSegments(missing.map((sg) => sg.title).filter((t) => KANJI.test(t)));
        try {
          const [src, files] = await Promise.all([
            fetch(KUROMOJI_JS).then((r) => { if (!r.ok) throw new Error('kuromoji.js: HTTP ' + r.status); return r.text(); }),
            downloadDict(),
          ]);
          let map = null;
          try {
            map = await tokenizeViaWorker(src, files, segs);
            tk = { tokenize: (seg) => (map[seg] || [['', seg]]).map(([r, sf]) => ({ reading: r, surface_form: sf })) };
          } catch (we) {
            workerNote = '別処理を使えませんでした(' + String((we && we.message) || we).slice(0, 60) + ')';
            setRead('辞書を組み立て中…(別処理が使えないため、数秒画面が止まります)');
            await new Promise((r) => setTimeout(r, 50)); // 表示を更新させてから重い処理へ
            tk = await tokenizerOnMain(src, files);
          }
        } catch (e) {
          notes.push('漢字の読み(' + String((e && e.message) || e).slice(0, 60) + ')');
        }
      }
      const out = { ...rm };
      for (const sg of missing) {
        const hasJa = KANJI.test(sg.title);
        const hasEn = /[A-Za-z]/.test(sg.title);
        if ((hasJa && !tk) || (hasEn && !eng)) continue; // 材料が揃わない曲は保存せず、次回やり直す
        out[sg.title] = readingsFor(sg.title, tk, eng);
      }
      store.set(LS_READ, JSON.stringify(out));
      readState = notes.length ? `${notes.join('・')}を取得できず、読み検索は一部のみ` : workerNote;
      readFrac = null;
    } catch {
      readState = '読みの準備に失敗しました';
      readFrac = null;
    } finally {
      readingBusy = false;
      attachReadings();
      renderMeta();
      renderResults();
    }
  }

  function editAlias(sg) {
    const cur = (aliasMap[sg.title] || []).join('、');
    const v = prompt(`「${sg.title}」の読みを追加します(ひらがな。複数は「、」区切り。空欄で削除)`, cur);
    if (v === null) return;
    const list = v.split(/[,、，\s]+/).map((x) => x.trim()).filter(Boolean);
    if (list.length) aliasMap[sg.title] = list; else delete aliasMap[sg.title];
    store.set(LS_ALIAS, JSON.stringify(aliasMap));
    attachReadings();
    renderResults();
  }

  // ===== 表示 =====
  function showError(msg, detail) {
    el.errorMsg.textContent = msg || '';
    el.error.hidden = !msg;
    const has = !!(msg && detail);
    el.errorDetail.hidden = !has;
    el.errorPre.textContent = has ? detail : '';
    if (has) el.errorDetail.open = true;
  }

  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `更新 ${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function fmtBpi(v) {
    if (v === null || v === undefined || Number.isNaN(Number(v))) return '-';
    return Number(v).toFixed(2);
  }

  function renderMeta() {
    el.metaCount.textContent = songs.length ? `${songs.length}曲(ANOTHER / LEGGENDARIA)` + (readState ? ` ・${readState}` : '') : '';
    el.metaTime.textContent = fmtTime(fetchedAt);
    el.prog.hidden = readFrac === null;
    if (readFrac !== null) el.progBar.style.width = Math.round(readFrac * 100) + '%';
  }

  function search(query) {
    const tokens = normalize(query).split(' ').filter(Boolean);
    if (!tokens.length) return [];
    const first = tokens[0];
    const lf = /^[ぁ-ゖー]+$/.test(first) ? loose(first) : '';
    const hits = [];
    for (const sg of songs) {
      const m = songMatches(sg, tokens);
      if (!m) continue;
      sg.viaReading = m === 2;
      // 0: 曲名で一致 / 1: 読みの先頭一致 / 2: 読みの途中一致
      sg.rank = m === 1 ? 0 : (lf && (sg.keys || []).some((k) => k.startsWith(lf)) ? 1 : 2);
      hits.push(sg);
    }
    hits.sort((a, b) => {
      const ap = a.norm.startsWith(first) ? 0 : 1;
      const bp = b.norm.startsWith(first) ? 0 : 1;
      return a.rank - b.rank || ap - bp || a.norm.localeCompare(b.norm, 'ja');
    });
    return hits;
  }

  function renderResults() {
    const query = el.q.value;
    el.results.textContent = '';

    if (!songs.length) {
      const p = document.createElement('p');
      p.className = 'notice';
      p.textContent = 'データがありません。右上の更新ボタンで取得してください。';
      el.results.append(p);
      return;
    }
    if (!normalize(query)) {
      const p = document.createElement('p');
      p.className = 'notice';
      p.textContent = '曲名の一部を入力すると、EXスコアが表示されます。ひらがなでも探せます(例: ひみこ、すーぱー)。';
      el.results.append(p);
      return;
    }

    const hits = search(query);
    if (!hits.length) {
      const p = document.createElement('p');
      p.className = 'notice';
      p.textContent = '一致する曲がありません。';
      el.results.append(p);
      return;
    }

    const frag = document.createDocumentFragment();
    for (const s of hits.slice(0, MAX_RESULTS)) {
      const card = document.createElement('article');
      card.className = 'song';

      const h = document.createElement('h2');
      h.textContent = s.title;
      if (s.viaReading) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = '読み一致';
        h.append(tag);
      }
      card.append(h);

      for (const r of s.rows) {
        const row = document.createElement('div');
        row.className = 'row';

        const d = document.createElement('div');
        d.className = `diff ${r.key}`;
        d.textContent = r.label;
        if (r.level !== null) {
          const lv = document.createElement('small');
          lv.textContent = `☆${r.level}`;
          d.append(lv);
        }

        const ex = document.createElement('div');
        ex.className = 'ex';
        ex.textContent = r.ex === null ? '-' : String(r.ex);

        const sub = document.createElement('div');
        sub.className = 'sub';
        const bpi = document.createElement('span');
        bpi.append('BPI ');
        const bpiV = document.createElement('b');
        bpiV.textContent = fmtBpi(r.bpi);
        bpi.append(bpiV);
        const ver = document.createElement('span');
        ver.append('更新 ');
        const verV = document.createElement('b');
        verV.textContent = r.version || '-';
        ver.append(verV);
        sub.append(bpi, ver);

        row.append(d, ex, sub);
        card.append(row);
      }
      const tools = document.createElement('div');
      tools.className = 'tools';
      const ab = document.createElement('button');
      ab.type = 'button';
      ab.className = 'alias-btn';
      ab.textContent = (aliasMap[s.title] || []).length ? '読みを編集' : '読みを追加';
      ab.setAttribute('aria-label', `${s.title}の読みを登録`);
      ab.addEventListener('click', () => editAlias(s));
      tools.append(ab);
      card.append(tools);
      frag.append(card);
    }
    if (hits.length > MAX_RESULTS) {
      const p = document.createElement('p');
      p.className = 'notice';
      p.textContent = `他${hits.length - MAX_RESULTS}件。もう少し絞り込んでください。`;
      frag.append(p);
    }
    el.results.append(frag);
  }

  // ===== 画面切替 =====
  function show(view) {
    el.viewSearch.hidden = view !== 'search';
    el.viewSettings.hidden = view !== 'settings';
    if (view === 'settings') {
      el.token.value = store.get(LS_TOKEN) || '';
      el.uid.value = store.get(LS_UID) || '';
      el.apiBase.value = store.get(LS_BASE) || '';
      el.uidMsg.textContent = '';
      el.settingsMsg.hidden = true;
    } else {
      el.q.focus({ preventScroll: true });
    }
  }

  async function refresh({ silent = false } = {}) {
    el.btnRefresh.disabled = true;
    el.btnRefresh.textContent = '…';
    if (!silent) showError('');
    try {
      await fetchBestEver();
      showError('');
      renderMeta();
      renderResults();
      ensureReadings();
    } catch (e) {
      showError(e.message || '取得に失敗しました。', e.detail || (e.stack ? String(e.stack).split('\n')[0] : ''));
    } finally {
      el.btnRefresh.disabled = false;
      el.btnRefresh.textContent = '↻';
    }
  }

  // ===== ユーザーID自動取得 =====
  function pickId(o) {
    if (!o || typeof o !== 'object') return null;
    const cands = [o.userId, o.uid, o.id, o.user && (o.user.userId || o.user.uid || o.user.id)];
    const v = cands.find((x) => x !== undefined && x !== null && x !== '');
    return v === undefined ? null : String(v);
  }

  // JWTなら中身(payload)を読む。ネットワーク通信はしない
  function decodeJwt(t) {
    const parts = t.split('.');
    if (parts.length !== 3) return null;
    try {
      let b = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      b = b.padEnd(Math.ceil(b.length / 4) * 4, '=');
      const bin = atob(b);
      const json = decodeURIComponent(Array.from(bin, (c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
      const o = JSON.parse(json);
      return o && typeof o === 'object' ? o : null;
    } catch { return null; }
  }

  async function autoUid() {
    applyBase(el.apiBase.value.trim().replace(/\/+$/, ''));
    const token = cleanToken(el.token.value);
    const log = [];
    const done = (msg) => {
      el.uidMsg.textContent = msg;
      el.uidDiag.textContent = log.join('\n');
      el.uidDiag.hidden = !log.length;
    };
    if (!token) { done('先にトークンを入力してください。'); return; }
    el.uidMsg.textContent = '取得中…';
    el.uidDiag.hidden = true;

    // 1) トークンがJWTなら、中にuidが入っていることがある
    const claims = decodeJwt(token);
    if (claims) {
      log.push(`[1] トークンはJWT形式。含まれる項目: ${Object.keys(claims).join(', ') || '(なし)'}`);
      const id = claims.uid || claims.user_id || claims.userId || claims.sub;
      if (id) {
        el.uid.value = String(id);
        log.push(`    → ID候補「${id}」を採用`);
        done('トークンからユーザーID候補を取り出しました。「保存して取得」で確認してください(404なら別のIDです)。');
        return;
      }
      log.push('    → uid / user_id / sub が見当たりません');
    } else {
      log.push('[1] トークンはJWT形式ではないため、中身からは読み取れません');
    }

    // 2) ユーザー情報APIを候補パスで順に試す
    log.push('[2] ユーザー情報APIを試行');
    const bases = [API_BASE];
    try { const o = new URL(API_BASE).origin; if (o !== API_BASE) bases.push(o); } catch {}
    const results = [];
    for (const base of bases) {
      for (const p of ME_PATH_CANDIDATES) {
        const r = await probe(base + p, token);
        results.push(r);
        let extra = '';
        if (r.ok && r.json !== undefined) {
          const id = pickId(r.json);
          if (id) {
            el.uid.value = id;
            log.push(`  GET ${r.path} → ${describe(r)}`);
            log.push(`    → ユーザーID「${id}」を取得`);
            done('ユーザーIDを取得しました。');
            return;
          }
          const keys = r.json && typeof r.json === 'object' ? Object.keys(r.json).join(', ') : typeof r.json;
          extra = ` / IDらしい項目なし。キー: ${keys}`;
        }
        log.push(`  GET ${r.path} → ${describe(r)}${extra}`);
      }
    }

    // 失敗の要約
    const allNet = results.every((r) => r.netError);
    const all404 = results.every((r) => r.status === 404);
    const anyOkNoId = results.some((r) => r.ok && r.json !== undefined);
    const any401 = results.some((r) => r.status === 401 && !r.jsonError);
    let why;
    if (allNet) why = 'どの候補にも通信できませんでした(オフラインまたはCORSの可能性。中継URLの設定が必要かもしれません)。';
    else if (any401) why = 'ユーザー情報APIには届きましたが、トークンが受け付けられませんでした(401)。トークンの種類・コピーミス・期限を確認してください。';
    else if (all404) why = '候補のパスがすべて404でした。ユーザー情報APIのパスが候補と違います。';
    else if (anyOkNoId) why = '応答は返りましたが、ユーザーIDの項目が見つかりません(下のキー一覧を確認)。';
    else why = '候補のパスでは取得できませんでした(下の診断を確認)。';
    done(`自動取得できませんでした: ${why} BPIM2にログインして自分のページを開き、URLの /users/ の次の部分を貼り付けても入力できます。`);
  }

  // ===== イベント =====
  let timer = null;
  el.q.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(renderResults, 60);
  });
  el.btnRefresh.addEventListener('click', () => refresh());
  el.btnSettings.addEventListener('click', () => show('settings'));
  el.btnBack.addEventListener('click', () => show('search'));
  el.btnAutoUid.addEventListener('click', autoUid);

  el.btnSave.addEventListener('click', async () => {
    const token = cleanToken(el.token.value);
    const uid = el.uid.value.trim();
    if (!token || !uid) {
      el.settingsMsg.textContent = 'トークンとユーザーIDの両方を入力してください。';
      el.settingsMsg.hidden = false;
      return;
    }
    const baseIn = el.apiBase.value.trim().replace(/\/+$/, '');
    if (baseIn && !/^https:\/\//.test(baseIn)) {
      el.settingsMsg.textContent = 'APIのURLは https:// から始めてください。';
      el.settingsMsg.hidden = false;
      return;
    }
    const saved = store.set(LS_TOKEN, token) && store.set(LS_UID, uid);
    if (baseIn) store.set(LS_BASE, baseIn); else store.del(LS_BASE);
    applyBase(baseIn);
    if (!saved) {
      el.settingsMsg.textContent = 'この端末では保存できませんでした(プライベートブラウズ中の可能性があります)。';
      el.settingsMsg.hidden = false;
      return;
    }
    show('search');
    await refresh();
  });

  el.btnClear.addEventListener('click', () => {
    if (!confirm('保存したトークン・ユーザーID・スコアデータを削除します。よろしいですか?')) return;
    store.del(LS_TOKEN); store.del(LS_UID); store.del(LS_DATA);
    songs = []; fetchedAt = null;
    el.token.value = ''; el.uid.value = '';
    renderMeta(); renderResults();
    el.settingsMsg.textContent = '削除しました。';
    el.settingsMsg.hidden = false;
  });

  // ===== 起動 =====
  const hasAuth = !!(store.get(LS_TOKEN) && store.get(LS_UID));
  if (!hasAuth) {
    show('settings');
  } else {
    show('search');
    if (loadCache()) {
      renderMeta();
      renderResults();
      ensureReadings();
    } else {
      renderResults();
      refresh();
    }
  }
})();
</script>
</body>
</html>
